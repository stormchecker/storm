name: 'Stormpy compatibility'
description: >
  Build and test stormpy (master) against the installed Storm.
  If stormpy is incompatible, the Storm development version x.y.z.N must be increased.
inputs:
  nr_jobs:
    description: "Number of parallel build jobs"
    default: "4"
  build_type:
    description: "Build type of stormpy (Debug or Release), should match the build type of Storm"
    default: "Release"
  storm_version:
    description: "Full Storm version x.y.z(.N) under test"
    required: true
  storm_base_version:
    description: "Full Storm version x.y.z(.N) of the base branch of the PR"
    required: true

runs:
  using: "composite"
  steps:
    - name: Install Python
      run: |
        apt-get update
        apt-get install -y --no-install-recommends python3 python3-dev python3-venv
      shell: bash

    - name: Checkout stormpy
      uses: actions/checkout@v7
      with:
        repository: stormchecker/stormpy
        ref: master
        path: .ci-stormpy
        fetch-depth: 1

    # Build and test stormpy
    - name: Build stormpy
      id: build
      continue-on-error: true  # Failures are evaluated afterward
      working-directory: ./.ci-stormpy
      run: |
        python3 -m venv "${RUNNER_TEMP}/stormpy-venv"
        source "${RUNNER_TEMP}/stormpy-venv/bin/activate"
        pip install -v \
            --config-settings=cmake.build-type=${{ inputs.build_type }} \
            --config-settings=cmake.define.STORMPY_ALLOW_STORM_FETCH=OFF \
            --config-settings=cmake.define.CMAKE_BUILD_PARALLEL_LEVEL=${{ inputs.nr_jobs }} \
            ".[test]" 2>&1 | tee "${RUNNER_TEMP}/build-stormpy.log"
      shell: bash
    - name: Test stormpy
      id: test
      if: steps.build.outcome == 'success'
      continue-on-error: true  # Failures are evaluated afterward
      working-directory: ./.ci-stormpy
      run: |
        source "${RUNNER_TEMP}/stormpy-venv/bin/activate"
        pytest tests
      shell: bash

    - name: Evaluate stormpy compatibility
      env:
        BUILD: ${{ steps.build.outcome }}
        TEST: ${{ steps.test.outcome }}
        PR_VERSION: ${{ inputs.storm_version }}
        BASE_VERSION: ${{ inputs.storm_base_version }}
      run: |
        # Incompatibilities are allowed if the development version x.y.z.N was increased compared to the base branch,
        # or if stormpy has not been adapted to the base version of Storm yet.
        MIN_VERSION=$(sed -nE 's/.*set\(STORM_MIN_VERSION "([^"]+)"\).*/\1/p' .ci-stormpy/CMakeLists.txt)
        [ -n "${MIN_VERSION}" ] || { echo "::error::Could not read STORM_MIN_VERSION of stormpy"; exit 1; }

        # True if version $1 is strictly greater than version $2
        version_gt() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n 1)" = "$1" ]; }

        # Print annotation $1 (notice, warning, error) with message $2 and add the message to the job summary
        report() { echo "::$1 file=CMakeLists.txt::$2"; echo "$2" >> "${GITHUB_STEP_SUMMARY}"; }

        {
          echo "### Stormpy compatibility"
          echo "Storm version: \`${PR_VERSION}\`, base version: \`${BASE_VERSION}\`, stormpy \`STORM_MIN_VERSION\`: \`${MIN_VERSION}\`"
          echo
        } >> "${GITHUB_STEP_SUMMARY}"

        if [ "${BUILD}" = success ] && [ "${TEST}" = success ]; then
          report notice "Stormpy (master) builds and passes its tests with Storm ${PR_VERSION}."
        # Storm version is rejected by stormpy. CMake wraps long error messages over several lines, so collapse whitespace before matching
        elif tr -s '[:space:]' ' ' < "${RUNNER_TEMP}/build-stormpy.log" | grep -q "is not supported anymore"; then
          report error "Stormpy (master) requires Storm >= ${MIN_VERSION}, but this is Storm ${PR_VERSION}. Please rebase onto the latest master."
          exit 1
        elif version_gt "${PR_VERSION}" "${BASE_VERSION}"; then
          report warning "Stormpy (master) is incompatible with these changes. As the Storm version was increased from ${BASE_VERSION} to ${PR_VERSION}, this is allowed. Please adapt stormpy accordingly and set STORM_MIN_VERSION to ${PR_VERSION} in stormpy."
        elif version_gt "${BASE_VERSION}" "${MIN_VERSION}"; then
          report warning "Stormpy (master) is incompatible with Storm ${PR_VERSION}. Stormpy has not been adapted to Storm ${BASE_VERSION} yet (it requires Storm >= ${MIN_VERSION}), so the incompatibility might not stem from these changes. Make sure that stormpy is adapted accordingly."
        else
          # Suggest the next development version: x.y.z -> x.y.z.1 and x.y.z.N -> x.y.z.N+1
          IFS=. read -r major minor patch dev <<< "${BASE_VERSION}"
          report error "These changes make stormpy (master) incompatible. Please increase the development version of Storm in CMakeLists.txt (e.g. from ${BASE_VERSION} to ${major}.${minor}.${patch}.$(( ${dev:-0} + 1 ))) and adapt stormpy accordingly (including setting STORM_MIN_VERSION to the new version)."
          exit 1
        fi
      shell: bash

    - name: Clean up
      if: always()
      run: rm -rf .ci-stormpy "${RUNNER_TEMP}/stormpy-venv" "${RUNNER_TEMP}/build-stormpy.log"
      shell: bash
