name: 'Starter project'
description: 'Build and test starter project'
inputs:
  stormDir:
    description: 'The Storm directory (or empty if the installed version should be used)'
    required: true
    type: string
    default: ''
  command:
    description: 'The command to run for the starter project'
    required: true
    type: string
    default: ''

runs:
  using: "composite"
  steps:
    # Native (bare runner or GitHub Actions container)
    - name: Checkout starter-project
      if: ${{ (inputs.stormDir != '') }}
      run: |
        cd ..; git clone https://github.com/stormchecker/storm-project-starter-cpp storm-starter
      shell: bash

    - name: Configure and make starter project (intree Storm)
      if: ${{ (inputs.stormDir != '') }}
      run: |
        cd ../storm-starter; mkdir build-intree; cd build-intree; cmake -DNEVER_FETCH_STORM=TRUE -DSTORM_ROOT="${{ inputs.stormDir }}"  ..
        make -j ${NR_JOBS}
        ./bin/starter-project ${{ inputs.command }}
      shell: bash
    - name: Configure and make starter project (installed Storm)
      if: ${{ (inputs.stormDir == '') }}
      run: |
        cd ../storm-starter; mkdir build-installed; cd build-installed; cmake -DNEVER_FETCH_STORM=TRUE  ..
        make -j ${NR_JOBS}
        ./bin/starter-project ${{ inputs.command }}
      shell: bash
