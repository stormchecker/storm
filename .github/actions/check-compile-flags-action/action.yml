name: 'Check compile flags'
description: 'Check compile flags of Storm'
inputs:
  buildType:
    description: 'CMake build type'
    required: true
    type: string
    default: 'Release'

runs:
  using: "composite"
  steps:
    - name: Check compile flags
      # The same script is used in the Dockerfile
      run: bash "${{ github.action_path }}/check-flags.sh" build/src/storm/CMakeFiles/storm.dir "${{ inputs.buildType }}"
      shell: bash
