name: CI Weekly
# Extensive tests (run weekly) across all configurations.
# No cache, not fail-fast, full task suite including deploy.

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  # Load configurations and filter according to scope (quick/normal)
  prepare:
    uses: ./.github/workflows/ci-prepare-configs.yml
    with:
      mode: extensive

  linuxTests:
    needs: prepare
    name: ${{ matrix.config.name }} (${{ matrix.buildType }})
    runs-on: ubuntu-latest
    container: ${{ matrix.config.baseImg }}
    strategy:
      fail-fast: false
      matrix:
        buildType: ["Debug", "Release"]
        config: ${{ fromJson(needs.prepare.outputs.linuxTests) }}
    steps:
      - name: Git clone
        uses: actions/checkout@v7
      - name: Ensure jq is available
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y jq
            elif command -v pacman >/dev/null 2>&1; then
              pacman -Sy --noconfirm jq
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache jq
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y jq
            else
              echo "::error::No known package manager found to install jq"
              exit 1
            fi
          fi
      - name: Install packages
        if: matrix.config.setup != ''
        run: ${{ matrix.config.setup }}
      - name: Resolve config
        id: resolve-config
        env:
          CONFIG: ${{ toJson(matrix.config) }}
        # Update config: set build type, set developer mode for debug
        run: |
          RESOLVED=$(echo "$CONFIG" | jq -c --arg bt "${{ matrix.buildType }}" '.buildType = $bt | .Developer = (.buildType == "Debug")')
          echo "config=$RESOLVED" >> "$GITHUB_OUTPUT"
      - name: Build and test Storm
        uses: ./.github/actions/build-test-action
        with:
          nr_jobs: "4"
          name: ${{ matrix.config.name }}
          config: ${{ steps.resolve-config.outputs.config }}
          restore_cache: false
          save_cache: false
          install: true

  macTests:
    needs: prepare
    name: ${{ matrix.config.name }} (${{ matrix.buildType }})
    runs-on: ${{ matrix.config.distro }}
    strategy:
      fail-fast: false
      matrix:
        buildType: ["Debug", "Release"]
        config: ${{ fromJson(needs.prepare.outputs.macTests) }}
    steps:
      - name: Git clone
        uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.config.xcode }}
      - name: Install dependencies
        run: |
          brew update
          brew install automake boost ccache cln ginac glpk highs hwloc libarchive xerces-c z3
      - name: Resolve config
        id: resolve-config
        env:
          CONFIG: ${{ toJson(matrix.config) }}
        # Update config: set build type, set developer mode for debug
        run: |
          RESOLVED=$(echo "$CONFIG" | jq -c --arg bt "${{ matrix.buildType }}" '.buildType = $bt | .Developer = (.buildType == "Debug")')
          echo "config=$RESOLVED" >> "$GITHUB_OUTPUT"
      - name: Build and test Storm
        uses: ./.github/actions/build-test-action
        with:
          nr_jobs: "4"
          name: ${{ matrix.config.name }}
          config: ${{ steps.resolve-config.outputs.config }}
          restore_cache: false
          save_cache: false
          install: true

  deploy:
    name: ${{ matrix.config.buildType }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {buildType: "Debug",
             dockerTag: "ci-debug"
          }
          - {buildType: "Release",
             dockerTag: "ci"
          }
          # TODO: Add binaries build/publish configs
    uses: ./.github/workflows/test-deploy.yml
    with:
      nr_jobs: "4"
      buildType: ${{ matrix.config.buildType }}
      dockerTag: ${{ matrix.config.dockerTag }}
    secrets: inherit

  notify:
    name: Email notification
    runs-on: ubuntu-latest
    needs: [linuxTests, macTests, deploy]
    if: github.repository_owner == 'stormchecker' && always()
    steps:
      - uses: technote-space/workflow-conclusion-action@v3
      - uses: dawidd6/action-send-mail@v22
        with:
          server_address: ${{ secrets.STORM_CI_MAIL_SERVER }}
          server_port: 587
          username: ${{ secrets.STORM_CI_MAIL_USERNAME }}
          password: ${{ secrets.STORM_CI_MAIL_PASSWORD }}
          subject: "[You broke it] CI Weekly failed for ${{ github.repository }}"
          body:
            "CI job of ${{ github.repository }} has failed for commit ${{ github.sha }}.\n\
            The error type is: ${{ env.WORKFLOW_CONCLUSION }}.\n\n\
            For more information, see https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          to: ${{ secrets.STORM_CI_MAIL_RECIPIENTS }}
          from: Github Actions <you-broke-it@stormchecker.org>
        if: env.WORKFLOW_CONCLUSION != 'success'
