name: Release new version
# Triggered by new a release on GitHub
# - checks that the release tag and the Storm version are X.Y.Z
# - updates stable branch
# - deploys Docker containers
# - builds Debian packages and adds them to the release
# - updates Storm version in stormpy via PR
# - sets Storm development version in Storm via PR

# Needs personal access token CI_token with permissions 'pull-requests' and 'workflows'

on:
  release:
    types: [published]

jobs:
  get_version:
    # Get Storm version from CMakeLists of the release
    uses: ./.github/workflows/get-version.yml

  check_version:
    # Check that the release has a version X.Y.Z without development counter
    needs: get_version
    runs-on: ubuntu-latest
    steps:
      - name: Check version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag '$TAG' is not of the form X.Y.Z" >&2
            exit 1
          fi
          VERSION="${{ needs.get_version.outputs.full_version }}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Storm version '$VERSION' in CMakeLists.txt does not match release tag '$TAG'" >&2
            exit 1
          fi

  deploy_docker:
    # Create Docker images for tag
    needs: check_version
    uses: ./.github/workflows/release_docker.yml
    with:
      # Use the tag from the release
      tag: ${{ github.event.release.tag_name }}
    secrets: inherit

  update_stable:
    # Update stable branch
    needs: check_version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Git clone
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: Rebase
        run: |
          git config user.name 'Stormchecker bot'
          git config user.email 'dev@stormchecker.org'
          git fetch origin stable
          git checkout stable
          git rebase ${{ github.event.release.tag_name }}
          git push origin stable

  deploy_docker_stable:
    # Create Docker images for stable branch
    needs: update_stable
    uses: ./.github/workflows/release_docker.yml
    with:
      tag: stable
    secrets: inherit

  get_carl_tag:
    # Get carl-storm version used by the release
    runs-on: ubuntu-latest
    outputs:
      carl_tag: ${{ steps.carl.outputs.carl_tag }}
    steps:
      - name: Git clone
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Read carl-storm version from CMakeLists.txt
        id: carl
        run: |
          carl_tag=$(sed -n -E 's/.*STORM_CARL_GIT_TAG_DEFAULT "([^"]+)".*/\1/p' CMakeLists.txt)
          test -n "$carl_tag"
          echo "carl_tag=$carl_tag" >> "$GITHUB_OUTPUT"

  build_deb:
    # Create and test Debian packages (Release & Debug) for the new release
    needs: get_carl_tag
    strategy:
      matrix:
        build_type: [Release, Debug]
    uses: ./.github/workflows/create_deb.yml
    with:
      version: ${{ github.event.release.tag_name }}
      build_type: ${{ matrix.build_type }}
      carl_tag: ${{ needs.get_carl_tag.outputs.carl_tag }}

  upload_deb:
    # Add Debian packages as assets to the release
    needs: build_deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download deb artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: storm-deb-*
          path: debs
          merge-multiple: true
      - name: Upload debs to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} debs/*.deb --repo ${{ github.repository }} --clobber

  update_stormpy:
    # Trigger generation of PR in stormpy which updates the Storm version
    needs: [deploy_docker, deploy_docker_stable]
    uses: stormchecker/stormpy/.github/workflows/update_storm.yml@master
    with:
      storm_version: ${{ github.event.release.tag_name }}
    secrets:
      personal_access_token: ${{ secrets.CI_token }}

  set_storm_dev:
    # Update Storm version again to reflect future development version
    needs: [deploy_docker, deploy_docker_stable]
    runs-on: ubuntu-latest
    steps:
      - name: Git clone
        uses: actions/checkout@v7
        with:
          repository: stormchecker/storm
          ref: master
      - name: Set Storm dev version
        run: |
          # Add .1 suffix  to Storm version
          sed -i -E 's/(\s+)VERSION ([0-9]+\.[0-9]+\.[0-9]+)/\1VERSION \2.1/' CMakeLists.txt
      - name: Commit update
        run: |
          git diff
          git config user.name 'Stormchecker bot'
          git config user.email 'dev@stormchecker.org'
          git commit -am "Set development version of Storm"
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ci/storm-dev-version
          delete-branch: true
          title: 'Set development version of Storm'
          body: |
            Auto-generated pull request triggered by a new Storm version.
            - Manually close and reopen this PR to trigger the CI.

  notify:
    name: Email notification
    needs: [deploy_docker, update_stable, get_carl_tag, build_deb, upload_deb, update_stormpy, set_storm_dev]
    # Only run in main repo and even if previous step failed
    if: github.repository_owner == 'stormchecker' && always()
    uses: stormchecker/ci-workflows/.github/workflows/notify_email.yml@v1
    with:
      title: Release
    secrets: inherit
    permissions:
      actions: read
