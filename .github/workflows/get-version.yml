name: Get Storm version
on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to get the version from (default: commit of the calling workflow)"
        type: string
        default: ''
    outputs:
      version:
        description: Version X.Y.Z from CMakeLists (without development counter)
        value: ${{ jobs.get-version.outputs.version }}
      full_version:
        description: Full version from CMakeLists as given (X.Y.Z or X.Y.Z.N with development counter N)
        value: ${{ jobs.get-version.outputs.full_version }}
      sha:
        description: Storm commit SHA
        value: ${{ jobs.get-version.outputs.sha }}

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      full_version: ${{ steps.version.outputs.full_version }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.ref || job.workflow_sha }}
          fetch-depth: 1
          sparse-checkout: CMakeLists.txt

      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: version
        run: |
          VERSION=$(sed -n '/^project(storm[[:space:]]*$/,/^)/{/^[[:space:]]*VERSION[[:space:]]/s/.*VERSION[[:space:]]*//p}' CMakeLists.txt)
          BASE=$(echo "$VERSION" | cut -d. -f1-3)
          if [ -z "$BASE" ]; then
            echo "Failed to extract version from CMakeLists.txt" >&2
            exit 1
          fi
          echo "version=$BASE" >> "$GITHUB_OUTPUT"
          echo "full_version=$VERSION" >> "$GITHUB_OUTPUT"
