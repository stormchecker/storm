# Builds and tests Debian packages of Storm.
# Packages are uploaded as artifacts named 'storm-deb-<distro>-<platform>[-debug]'.
name: Build deb package

on:
  # needed to reuse the workflow from another one
  workflow_call:
    inputs:
      version:
        description: 'Version to use for Storm (e.g. 1.1.0)'
        required: true
        type: string
        default: 'x.y.z'
      build_type:
        description: 'Build type (Release, Debug)'
        required: false
        type: string
        default: 'Release'
      carl_tag:
        description: 'carl-storm tag to build against (empty: use the default carl tag of the CMakeLists.txt)'
        required: false
        type: string
        default: ''
  # needed to trigger the workflow manually
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to use for Storm (e.g. 1.1.0)'
        required: true
        type: string
        default: 'x.y.z'
      build_type:
        description: 'Build type (Release, Debug)'
        required: false
        type: string
        default: 'Release'
      carl_tag:
        description: 'carl-storm tag to build against (empty: use the default carl tag of the CMakeLists.txt)'
        required: false
        type: string
        default: ''

env:
  # GitHub runners currently have 4 cores
  NR_JOBS: "4"
  # Suffix to distinguish debug packages
  BUILD_SUFFIX: ${{ inputs.build_type != 'Release' && '-debug' || '' }}

jobs:
  build_deb:
    name: Build Debian package on ${{ matrix.distro.name }}-${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    container: movesrwth/storm-basesystem:${{ matrix.distro.tag }}
    strategy:
      fail-fast: false
      matrix:
        distro:
          - {name: "debian12",
             tag: "debian-12"
            }
          - {name: "debian13",
             tag: "debian-13"
            }
        platform:
          - { name: amd64, runner: "ubuntu-latest" }
          - { name: arm64, runner: "ubuntu-24.04-arm" }

    steps:
      - name: Git clone
        uses: actions/checkout@v7
        with:
          repository: stormchecker/storm
      - name: Restore 3rdparty source cache
        id: cache-3rdparty-restore
        uses: ./.github/actions/cache-3rdparty-action
        with:
          restore: true
      - name: Configure Storm
        # Sets the debian version for CPack. CMake version remains unchanged because it must be numeric.
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE="${{ inputs.build_type }}" \
            -DSTORM_PORTABLE=ON \
            ${{ inputs.carl_tag != '' && format('-DSTORM_CARL_GIT_TAG="{0}"', inputs.carl_tag) || '' }} \
            -DSTORM_BUILD_TESTS=OFF \
            -DCPACK_DEBIAN_PACKAGE_VERSION=${{ inputs.version }}-${{ matrix.distro.name }} \
            -DCPACK_PACKAGE_FILE_NAME=storm-${{ inputs.version }}-${{ matrix.distro.name }}-${{ matrix.platform.name }}${BUILD_SUFFIX} \
            ${{ steps.cache-3rdparty-restore.outputs.cmake-args }}
      - name: Build Storm
        run: cmake --build build -j ${NR_JOBS}
      - name: Create .deb package
        run: cmake --build build --target package

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v7
        with:
          name: storm-deb-${{ matrix.distro.name }}-${{ matrix.platform.name }}${{ env.BUILD_SUFFIX }}
          path: build/*.deb


  test_deb:
    name: Test Debian package on ${{ matrix.distro.image }}-${{ matrix.platform.name }}
    needs: build_deb
    runs-on: ${{ matrix.platform.runner }}
    container: ${{ matrix.distro.image }}
    strategy:
      fail-fast: false
      matrix:
        distro:
           - {image: "debian:12",
              build_artifact: "debian12"
             }
           - {image: "debian:13",
              build_artifact: "debian13"
             }
           - {image: "ubuntu:24.04",
              build_artifact: "debian12"
             }
           - {image: "ubuntu:26.04",
              build_artifact: "debian13"
             }
           - {image: "ubuntu:rolling",
              build_artifact: "debian13"
             }
        platform:
          - { name: amd64, runner: "ubuntu-latest" }
          - { name: arm64, runner: "ubuntu-24.04-arm" }

    steps:
      - name: Download .deb artifact
        uses: actions/download-artifact@v8
        with:
          name: storm-deb-${{ matrix.distro.build_artifact }}-${{ matrix.platform.name }}${{ env.BUILD_SUFFIX }}
          path: package
      - name: Install package
        run: |
          apt-get update
          apt-get install -y ./package/*.deb
      - name: Run Storm
        run: storm --version
      - name: Build starter project using Storm
        run: |
          apt-get install -y build-essential ca-certificates cmake git
          git clone https://github.com/stormchecker/storm-project-starter-cpp /opt/storm-starter
          cmake -S /opt/storm-starter -B /opt/storm-starter/build -DNEVER_FETCH_STORM=TRUE
          cmake --build /opt/storm-starter/build -j ${NR_JOBS}
      - name: Run starter project
        working-directory: /opt/storm-starter
        run: ./build/bin/starter-project examples/die.pm examples/die.pctl
