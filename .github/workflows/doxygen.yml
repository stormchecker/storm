name: Doxygen
# Builds and deploys Storm's Doxygen documentation

on:
  push:
    branches: [master]
  # needed to trigger the workflow manually
  workflow_dispatch:

env:
  # GitHub runners currently have 4 cores
  NR_JOBS: "4"


jobs:

  deploy:
    name: Create documentation
    runs-on: ubuntu-latest
    container: movesrwth/storm-dependencies:latest
    # Do not run on forks
    if: github.repository_owner == 'stormchecker'
    # Run deployments in sequence to ensure correct deployment
    concurrency:
      group: deploy-doxygen
      cancel-in-progress: false
    steps:
      - name: Git clone
        uses: actions/checkout@v7
      - name: Install Doxygen
        run: apt-get update && apt-get install -qq -y doxygen graphviz
      - name: Configure Storm
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSTORM_PORTABLE=ON
      - name: Build Doxygen
        run: cmake --build build --target doc -j ${NR_JOBS}
      - name: Deploy doxygen
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.CI_DOC_DEPLOY_TOKEN }}
          publish_dir: ./build/doc/html
          external_repository: stormchecker/storm-doc
          publish_branch: main
          force_orphan: true

  notify:
    name: Email notification
    needs: [deploy]
    # Only run in main repo and even if previous step failed
    if: github.repository_owner == 'stormchecker' && always()
    uses: stormchecker/ci-workflows/.github/workflows/notify_email.yml@v1
    with:
      title: Doxygen generation
    secrets: inherit
    permissions:
      actions: read
