name: Doxygen
# Builds and deploys Storm's Doxygen documentation

on:
  schedule:
      # run daily
      - cron: '0 8 * * *'
  # needed to trigger the workflow manually
  workflow_dispatch:

env:
  # GitHub runners currently have 4 cores
  NR_JOBS: "4"


jobs:

  deploy:
    name: Create documentation
    runs-on: ubuntu-latest
    # Do not run on forks
    if: github.repository_owner == 'stormchecker'
    steps:
      - name: Git clone
        uses: actions/checkout@v7
      - name: Build Doxygen via Dockerfile
        run: docker build -t movesrwth/storm-doc:latest -f .github/workflows/Dockerfile.doxygen . --build-arg no_threads=${NR_JOBS}
      - name: Run Docker
        run: docker run -d -it --name ci movesrwth/storm-doc:latest
      - name: Copy doxygen
        run: docker cp ci:/opt/storm/build/doc/html .
      - name: Deploy doxygen
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.CI_DOC_DEPLOY_TOKEN }}
          publish_dir: ./html
          external_repository: stormchecker/storm-doc
          publish_branch: main
          force_orphan: true

  notify:
    name: Email notification
    needs: [deploy]
    # Only run in main repo and even if previous step failed
    if: github.repository_owner == 'stormchecker' && always()
    uses: stormchecker/ci-workflows/.github/workflows/notify_email.yml@v1
    with:
      title: Doxygen generation
    secrets: inherit
    permissions:
      actions: read
