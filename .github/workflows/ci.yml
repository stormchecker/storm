name: CI
# Build Storm and perform checks (run tests, check compiler flags, build starter project)

# on every pull request commit: run "quick" configs
# for every PR labeled "ready for review", on every master push, or on a manual run: run "normal" configs
# Configurations are defined in ci-configs.json.
# This CI then calls the tests in build-test-action and test-deploy with the given configurations.
# Cache is restored everywhere but only saved on master pushes.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [master]
  workflow_dispatch:

# On PRs a newer run cancels the running one.
# On master pushes each run is its own group (via run_id) so CI is never canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Load configurations and filter according to scope (quick/normal)
  prepare:
    uses: ./.github/workflows/ci-prepare-configs.yml
    with:
      mode: ${{ (github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ready for review')) && 'quick' || 'normal' }}

  linuxTests:
    needs: prepare
    name: ${{ matrix.config.name }} (${{ matrix.config.buildType }})
    runs-on: ubuntu-latest
    container: ${{ matrix.config.baseImg }}
    strategy:
      fail-fast: true
      matrix:
        config: ${{ fromJson(needs.prepare.outputs.linuxTests) }}
    steps:
      - name: Git clone
        uses: actions/checkout@v7
      - name: Ensure jq is available
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y jq
            elif command -v pacman >/dev/null 2>&1; then
              pacman -Sy --noconfirm jq
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache jq
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y jq
            else
              echo "::error::No known package manager found to install jq"
              exit 1
            fi
          fi
      - name: Install packages
        if: matrix.config.setup != ''
        run: ${{ matrix.config.setup }}
      - name: Resolve config
        id: resolve-config
        env:
          CONFIG: ${{ toJson(matrix.config) }}
        # Update config: disable PCH when using caching, set developer mode for debug.
        run: |
          if [ "${{ contains(matrix.config.scope, 'quick') }}" = "true" ]; then
            RESOLVED=$(echo "$CONFIG" | jq -c '.cmakeArgs += " -DSTORM_COMPILE_WITH_PCH=OFF" | .Developer = (.buildType == "Debug")')
          else
            RESOLVED=$(echo "$CONFIG" | jq -c '.Developer = (.buildType == "Debug")')
          fi
          echo "config=$RESOLVED" >> "$GITHUB_OUTPUT"
      - name: Build and test Storm
        uses: ./.github/actions/build-test-action
        with:
          nr_jobs: "4"
          name: ${{ matrix.config.name }}
          config: ${{ steps.resolve-config.outputs.config }}
          # ccache is only cached for configs in "quick" scope: caching everything would exceed GitHub's 10GB limit
          restore_cache: ${{ contains(matrix.config.scope, 'quick') }}
          save_cache: ${{ contains(matrix.config.scope, 'quick') && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          restore_3rdparty_cache: true
          save_3rdparty_cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          # Skip install steps for a quick PR push
          install: ${{ !(github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ready for review')) }}

  macTests:
    needs: prepare
    name: ${{ matrix.config.name }} (${{ matrix.config.buildType }})
    runs-on: ${{ matrix.config.distro }}
    strategy:
      fail-fast: true
      matrix:
        config: ${{ fromJson(needs.prepare.outputs.macTests) }}
    steps:
      - name: Git clone
        uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.config.xcode }}
      - name: Cache Homebrew downloads
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew
          key: buildtest-brew-${{ matrix.config.name }}-${{ hashFiles('.github/actions/build-test-action/action.yml') }}
          restore-keys: |
            buildtest-brew-${{ matrix.config.name }}-
      - name: Install dependencies
        run: |
          brew update
          brew install automake boost ccache cln ginac glpk highs hwloc libarchive xerces-c z3
      - name: Resolve config
        id: resolve-config
        env:
          CONFIG: ${{ toJson(matrix.config) }}
        # Update config: disable PCH when using caching, set developer mode for debug.
        run: |
          if [ "${{ contains(matrix.config.scope, 'quick') }}" = "true" ]; then
            RESOLVED=$(echo "$CONFIG" | jq -c '.cmakeArgs += " -DSTORM_COMPILE_WITH_PCH=OFF" | .Developer = (.buildType == "Debug")')
          else
            RESOLVED=$(echo "$CONFIG" | jq -c '.Developer = (.buildType == "Debug")')
          fi
          echo "config=$RESOLVED" >> "$GITHUB_OUTPUT"
      - name: Build and test Storm
        uses: ./.github/actions/build-test-action
        with:
          nr_jobs: "4"
          name: ${{ matrix.config.name }}
          config: ${{ steps.resolve-config.outputs.config }}
          # ccache is only cached for configs in "quick" scope: caching everything would exceed GitHub's 10GB limit.
          restore_cache: ${{ contains(matrix.config.scope, 'quick') }}
          save_cache: ${{ contains(matrix.config.scope, 'quick') && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          restore_3rdparty_cache: true
          save_3rdparty_cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          # Skip install steps for a quick PR push
          install: ${{ !(github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ready for review')) }}

  # Need to split deploy into two jobs
  # Otherwise the name is not correctly displayed when the job is skipped.
  deploy-debug:
    name: Deploy (Debug)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/test-deploy.yml
    with:
      nr_jobs: "4"
      buildType: "Debug"
      dockerTag: "ci-debug"
    secrets: inherit

  deploy-release:
    name: Deploy (Release)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/test-deploy.yml
    with:
      nr_jobs: "4"
      buildType: "Release"
      dockerTag: "ci"
    secrets: inherit

  notify:
    name: Email notification
    runs-on: ubuntu-latest
    needs: [linuxTests, macTests, deploy-debug, deploy-release]
    if: github.repository_owner == 'stormchecker' && github.event_name == 'push' && always()
    steps:
      - uses: technote-space/workflow-conclusion-action@v3
      - uses: dawidd6/action-send-mail@v22
        with:
          server_address: ${{ secrets.STORM_CI_MAIL_SERVER }}
          server_port: 587
          username: ${{ secrets.STORM_CI_MAIL_USERNAME }}
          password: ${{ secrets.STORM_CI_MAIL_PASSWORD }}
          subject: "[You broke it] CI failed for ${{ github.repository }} on master"
          body:
            "CI job of ${{ github.repository }} has failed for commit ${{ github.sha }}.\n\
            The error type is: ${{ env.WORKFLOW_CONCLUSION }}.\n\n\
            For more information, see https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          to: ${{ secrets.STORM_CI_MAIL_RECIPIENTS }}
          from: Github Actions <you-broke-it@stormchecker.org>
        if: env.WORKFLOW_CONCLUSION != 'success'
